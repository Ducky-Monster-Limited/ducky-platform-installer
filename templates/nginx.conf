# ducky local install ({{LABEL}}) — written by the ducky installer, do not
# edit: `ducky install` rewrites it. Loopback only; nothing on the LAN.

server {

    listen 127.0.0.1:{{HTTPS_PORT}} ssl;
    listen [::1]:{{HTTPS_PORT}} ssl;

    http2 on;

    server_name {{HOST}};

    access_log          {{LOGS}}/nginx_app.acc.log;
    error_log           {{LOGS}}/nginx_app.err.log;
    ssl_certificate     {{CERT}};
    ssl_certificate_key {{CERT_KEY}};

    client_max_body_size 0;

    # ducky doctor asks this to know nginx serves the current file
    location = /__ducky_nginx {
        default_type text/plain;
        return 200 "{{LABEL}} {{CONF_HASH}}";
    }

    location / {

        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600;
        proxy_send_timeout 600;

    }

}

server {

    listen 127.0.0.1:{{HTTPS_PORT}} ssl;
    listen [::1]:{{HTTPS_PORT}} ssl;

    http2 on;

    server_name {{API_HOST}};

    access_log          {{LOGS}}/nginx_api.acc.log;
    error_log           {{LOGS}}/nginx_api.err.log;
    ssl_certificate     {{CERT}};
    ssl_certificate_key {{CERT_KEY}};

    client_max_body_size 0;

    location / {

        proxy_pass http://127.0.0.1:{{API_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        # the native folder / file dialogs hold a request up to 10 min
        proxy_read_timeout 660;
        proxy_send_timeout 660;

        # CORS: the app (https://{{HOST}}) calls the api from the browser
        # with its client key + signature headers (a preflight); only that
        # one origin is answered (the api's local gate checks it as well).
        # Calls without an Origin (the app server, ducky start) pass as
        # they are

        set $ducky_cors "";

        if ($http_origin = "https://{{HOST}}") {
            set $ducky_cors "on";
        }
        if ($request_method = "OPTIONS") {
            set $ducky_cors "${ducky_cors}options";
        }
        if ($ducky_cors = "onoptions") {
            add_header "Access-Control-Allow-Origin" "$http_origin" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            add_header "Access-Control-Max-Age" 1728000 always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since,Timezone,X-Account-Id,X-Client-Key,X-Client-Signature,X-Client-Token,X-Timestamp,X-User-Language,X-User-Timezone" always;
            add_header "Content-Length" 0 always;
            add_header "Content-Type" "text/plain charset=UTF-8" always;
            return 204;
        }
        if ($ducky_cors = "on") {
            add_header "Access-Control-Allow-Origin" "$http_origin" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
        }

    }

}
